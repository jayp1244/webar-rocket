<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rocket Coloring Book</title>
    
    <!-- 1. ES Module Shim for older iOS compatibility -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

    <!-- 2. Updated Import Map -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
    </script>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
      #container { width: 100vw; height: 100vh; position: relative; }
      #ui { position: absolute; bottom: 30px; width: 100%; text-align: center; z-index: 2; }
      button { padding: 15px 30px; font-size: 18px; border-radius: 25px; border: none; background: #ff4757; color: white; font-weight: bold; cursor: pointer; }
      #hiddenCanvas { display: none; }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div id="ui">
      <button id="startButton">Launch AR</button>
    </div>
    <canvas id="hiddenCanvas"></canvas>

    <script type="module">
      import * as THREE from 'three';
      import { MindARThree } from 'mindar-image-three';

      const mindarThree = new MindARThree({
        container: document.querySelector("#container"),
        imageTargetSrc: "./rocket.mind" 
      });
      const {renderer, scene, camera} = mindarThree;

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
      dirLight.position.set(0, 5, 5);
      scene.add(dirLight);

      const anchor = mindarThree.addAnchor(0);
      const rocketGroup = new THREE.Group();
      
      const matBody = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.4});
      const matNose = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.4});
      const matFins = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.4});

      const bodyGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.8, 32);
      const body = new THREE.Mesh(bodyGeo, matBody);
      rocketGroup.add(body);

      const noseGeo = new THREE.ConeGeometry(0.2, 0.4, 32);
      const nose = new THREE.Mesh(noseGeo, matNose);
      nose.position.y = 0.6;
      rocketGroup.add(nose);

      const finGeo = new THREE.BoxGeometry(0.6, 0.2, 0.05);
      const fin1 = new THREE.Mesh(finGeo, matFins);
      fin1.position.set(0, -0.3, 0);
      rocketGroup.add(fin1);
      
      const windowGeo = new THREE.TorusGeometry(0.1, 0.02, 16, 100);
      const windowRim = new THREE.Mesh(windowGeo, new THREE.MeshStandardMaterial({color: 0x333333}));
      windowRim.position.set(0, 0.1, 0.2);
      rocketGroup.add(windowRim);

      rocketGroup.scale.set(0.8, 0.8, 0.8);
      rocketGroup.rotation.x = Math.PI / 2;
      anchor.group.add(rocketGroup);

      const video = document.createElement('video');
      const canvas = document.getElementById('hiddenCanvas');
      const ctx = canvas.getContext('2d');
      let colorsExtracted = false;

      function getAverageColor(xPos, yPos, size) {
        if (!video.videoWidth) return null;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const startX = Math.floor(canvas.width * xPos);
        const startY = Math.floor(canvas.height * yPos);
        
        const frameData = ctx.getImageData(startX, startY, size, size).data;
        let r = 0, g = 0, b = 0;
        
        for (let i = 0; i < frameData.length; i += 4) {
          r += frameData[i];
          g += frameData[i+1];
          b += frameData[i+2];
        }
        
        const pixelCount = frameData.length / 4;
        return new THREE.Color(`rgb(${Math.floor(r/pixelCount)}, ${Math.floor(g/pixelCount)}, ${Math.floor(b/pixelCount)})`);
      }

      anchor.onTargetFound = () => {
        if(!colorsExtracted && video.readyState === video.HAVE_ENOUGH_DATA) {
          const bodyColor = getAverageColor(0.50, 0.60, 20); 
          const noseColor = getAverageColor(0.50, 0.30, 20); 
          const finColor = getAverageColor(0.30, 0.70, 20);  
          
          if(bodyColor) matBody.color = bodyColor;
          if(noseColor) matNose.color = noseColor;
          if(finColor) matFins.color = finColor;
          
          colorsExtracted = true;
        }
      };

      // 3. Error Catching Wrapper
      document.querySelector("#startButton").addEventListener("click", async () => {
        try {
          document.querySelector("#startButton").style.display = "none";
          
          setTimeout(() => {
            const vids = document.getElementsByTagName('video');
            if(vids.length > 0) Object.assign(video, vids[0]);
          }, 1500);

          await mindarThree.start();
          renderer.setAnimationLoop(() => {
            renderer.render(scene, camera);
          });
        } catch (error) {
          alert("Camera initialization failed: " + error.message);
          document.querySelector("#startButton").style.display = "block";
        }
      });
    </script>
  </body>
</html>
