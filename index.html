<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Rocket Coloring Book</title>
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
    </script>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
      #container { width: 100vw; height: 100vh; position: relative; }
      #ui { position: absolute; bottom: 30px; width: 100%; text-align: center; z-index: 2; }
      button { padding: 15px 30px; font-size: 18px; border-radius: 25px; border: none; background: #ff4757; color: white; font-weight: bold; cursor: pointer; }
      #hiddenCanvas { display: none; }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div id="ui">
      <button id="startButton">Launch AR</button>
    </div>
    <canvas id="hiddenCanvas"></canvas>

    <script type="module">
      import * as THREE from 'three';
      import { MindARThree } from 'mindar-image-three';

      const mindarThree = new MindARThree({
        container: document.querySelector("#container"),
        imageTargetSrc: "./rocket.mind",
        filterMinCF: 0.0001, 
        filterBeta: 10,
        missTolerance: 20
      });
      const {renderer, scene, camera} = mindarThree;

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.2);
      scene.add(light);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(0, 5, 5);
      scene.add(dirLight);

      const anchor = mindarThree.addAnchor(0);
      const visualRocket = new THREE.Group();
      anchor.group.add(visualRocket); 

      const matBody = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.4});
      const matNose = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.4});
      const matFins = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.4});

      // Assembly scaled exactly to the 2D drawing dimensions
      const bodyGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.5, 32);
      const body = new THREE.Mesh(bodyGeo, matBody);
      visualRocket.add(body);

      const noseGeo = new THREE.ConeGeometry(0.2, 0.3, 32);
      const nose = new THREE.Mesh(noseGeo, matNose);
      nose.position.y = 0.4;
      visualRocket.add(nose);

      const finGeo = new THREE.BoxGeometry(0.6, 0.2, 0.05);
      const fin1 = new THREE.Mesh(finGeo, matFins);
      fin1.position.y = -0.15;
      visualRocket.add(fin1);
      
      const windowGeo = new THREE.TorusGeometry(0.08, 0.02, 16, 100);
      const windowRim = new THREE.Mesh(windowGeo, new THREE.MeshStandardMaterial({color: 0x333333}));
      windowRim.position.set(0, 0.1, 0.2);
      visualRocket.add(windowRim);

      // SMOKE PARTICLE SYSTEM
      const particleCount = 60;
      const particles = new THREE.InstancedMesh(
        new THREE.SphereGeometry(0.08, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xdddddd, transparent: true, opacity: 0.6 }),
        particleCount
      );
      const dummy = new THREE.Object3D();
      const particleData = [];
      for(let i = 0; i < particleCount; i++) {
        particleData.push({ x: 0, y: 0, z: 0, life: Math.random() * 100 });
      }
      particles.visible = false;
      visualRocket.add(particles);

      const canvas = document.getElementById('hiddenCanvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      
      let state = "WAITING"; 
      let animTimer = 0;

      // Drastically simplified and robust color extraction 
      function extractColors() {
        const vids = document.getElementsByTagName('video');
        if (vids.length === 0) return;
        const video = vids[0];
        if (!video.videoWidth) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        try {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        } catch(e) {
          console.warn("Canvas drawing blocked by mobile browser security.");
          return;
        }

        const sample = (x, y, radius) => {
          const data = ctx.getImageData(x - radius, y - radius, radius*2, radius*2).data;
          let r=0, g=0, b=0, count=0;
          for(let i=0; i<data.length; i+=4) {
            // Ignore pure black lines and white glare
            if ((data[i]>40 || data[i+1]>40 || data[i+2]>40) && (data[i]<240 || data[i+1]<240 || data[i+2]<240)) {
              r+=data[i]; g+=data[i+1]; b+=data[i+2]; count++;
            }
          }
          if(count===0) return null;
          return new THREE.Color(`rgb(${Math.floor(r/count)}, ${Math.floor(g/count)}, ${Math.floor(b/count)})`);
        };

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        
        const bodyColor = sample(cx, cy, 30); // Center of screen
        const noseColor = sample(cx, cy - (canvas.height * 0.15), 20); // Top
        const finColor = sample(cx - (canvas.width * 0.15), cy + (canvas.height * 0.1), 20); // Bottom left

        if (bodyColor) matBody.color.set(bodyColor);
        if (noseColor) matNose.color.set(noseColor);
        if (finColor) matFins.color.set(finColor);
      }

      anchor.onTargetFound = () => {
        // Reset the animation every time the paper is found
        animTimer = 0;
        state = "ALIGN";
        
        // Lay perfectly flat on the paper (matching silhouette)
        visualRocket.rotation.x = 0;
        visualRocket.position.set(0, 0, 0.2); 
        particles.visible = false;
        
        // Sample colors exactly 0.5 seconds after finding the page
        setTimeout(extractColors, 500);
      };

      document.querySelector("#startButton").addEventListener("click", async () => {
        try {
          document.querySelector("#startButton").style.display = "none";
          await mindarThree.start();
          
          renderer.setAnimationLoop(() => {
            if (anchor.group.visible) {
              animTimer += 0.016; // Time tracking (assuming 60fps)
              
              if (animTimer > 2.0 && animTimer < 4.0) {
                // PHASE 2: Stand Up
                state = "STAND";
                const progress = (animTimer - 2.0) / 2.0; 
                // Smoothly rotate 90 degrees to point at the camera
                visualRocket.rotation.x = progress * (Math.PI / 2);
                visualRocket.position.y = progress * (-0.2); 
                
              } else if (animTimer >= 4.0) {
                // PHASE 3: Ignite and Launch
                state = "LAUNCH";
                particles.visible = true;
                
                // Fly straight up (locally +Y)
                visualRocket.translateY(0.02);
                
                // Animate Smoke
                for(let i = 0; i < particleCount; i++) {
                  let p = particleData[i];
                  p.y -= 0.05; // Fall down locally
                  p.x += (Math.random() - 0.5) * 0.1; 
                  p.z += (Math.random() - 0.5) * 0.1;
                  p.life -= 1;
                  
                  if(p.life <= 0) {
                    p.y = -0.3; // Reset near the thruster
                    p.x = (Math.random() - 0.5) * 0.1;
                    p.z = (Math.random() - 0.5) * 0.1;
                    p.life = 100;
                  }
                  
                  dummy.position.set(p.x, p.y, p.z);
                  const scale = Math.max(0, p.life / 100);
                  dummy.scale.set(scale, scale, scale);
                  dummy.updateMatrix();
                  particles.setMatrixAt(i, dummy.matrix);
                }
                particles.instanceMatrix.needsUpdate = true;
              }
            }
            renderer.render(scene, camera);
          });
        } catch (error) {
          alert("Camera initialization failed: " + error.message);
          document.querySelector("#startButton").style.display = "block";
        }
      });
    </script>
  </body>
</html>
