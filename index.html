<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Rocket Coloring Book</title>
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
    </script>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
      #container { width: 100vw; height: 100vh; position: relative; }
      #ui { position: absolute; bottom: 30px; width: 100%; text-align: center; z-index: 2; }
      button { padding: 15px 30px; font-size: 18px; border-radius: 25px; border: none; background: #ff4757; color: white; font-weight: bold; cursor: pointer; }
      #hiddenCanvas { display: none; }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div id="ui">
      <button id="startButton">Launch AR</button>
    </div>
    <canvas id="hiddenCanvas"></canvas>

    <script type="module">
      import * as THREE from 'three';
      import { MindARThree } from 'mindar-image-three';

      const mindarThree = new MindARThree({
        container: document.querySelector("#container"),
        imageTargetSrc: "./rocket.mind",
        filterMinCF: 0.0001, 
        filterBeta: 10,
        missTolerance: 20
      });
      const {renderer, scene, camera} = mindarThree;

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.2);
      scene.add(light);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(0, 5, 5);
      scene.add(dirLight);

      const anchor = mindarThree.addAnchor(0);
      const visualRocket = new THREE.Group();
      anchor.group.add(visualRocket); 

      const matBody = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.4});
      const matNose = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.4});
      const matFins = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.4});

      const bodyGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.8, 32);
      const body = new THREE.Mesh(bodyGeo, matBody);
      visualRocket.add(body);

      const noseGeo = new THREE.ConeGeometry(0.2, 0.4, 32);
      const nose = new THREE.Mesh(noseGeo, matNose);
      nose.position.y = 0.6;
      visualRocket.add(nose);

      const finGeo = new THREE.BoxGeometry(0.6, 0.2, 0.05);
      const fin1 = new THREE.Mesh(finGeo, matFins);
      fin1.position.set(0, -0.3, 0);
      visualRocket.add(fin1);
      
      const windowGeo = new THREE.TorusGeometry(0.1, 0.02, 16, 100);
      const windowRim = new THREE.Mesh(windowGeo, new THREE.MeshStandardMaterial({color: 0x333333}));
      windowRim.position.set(0, 0.1, 0.2);
      visualRocket.add(windowRim);

      // SCALED DOWN AND LOWERED SO IT STAYS IN THE CAMERA VIEW
      visualRocket.scale.set(0.5, 0.5, 0.5);
      visualRocket.position.z = 0.2; 
      visualRocket.rotation.x = Math.PI / 2;

      const particleCount = 60;
      const particles = new THREE.InstancedMesh(
        new THREE.SphereGeometry(0.08, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xdddddd, transparent: true, opacity: 0.6 }),
        particleCount
      );
      const dummy = new THREE.Object3D();
      const particleData = [];
      for(let i = 0; i < particleCount; i++) {
        particleData.push({
          x: (Math.random() - 0.5) * 0.2,
          y: -0.4,
          z: (Math.random() - 0.5) * 0.2,
          life: Math.random() * 100
        });
      }
      particles.visible = false;
      visualRocket.add(particles);

      const canvas = document.getElementById('hiddenCanvas');
      const ctx = canvas.getContext('2d');
      let colorsExtracted = false;
      let state = "WAITING"; 
      let launchVelocity = 0;
      let launchTimeout = null;

      function getColorAt3DCoordinate(localX, localY, localZ, radius) {
        const video = mindarThree.video;
        if (!video || !video.videoWidth) return null;
        
        const dummyVec = new THREE.Vector3(localX, localY, localZ);
        dummyVec.applyMatrix4(anchor.group.matrixWorld);
        dummyVec.project(camera); 
        
        const screenX = Math.floor((dummyVec.x * 0.5 + 0.5) * video.videoWidth);
        const screenY = Math.floor((-dummyVec.y * 0.5 + 0.5) * video.videoHeight);
        
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const frameData = ctx.getImageData(screenX - radius, screenY - radius, radius*2, radius*2).data;
        let r = 0, g = 0, b = 0, validPixels = 0;
        
        for (let i = 0; i < frameData.length; i += 4) {
          const pr = frameData[i], pg = frameData[i+1], pb = frameData[i+2];
          if ((pr > 40 || pg > 40 || pb > 40) && (pr < 240 || pg < 240 || pb < 240)) {
            r += pr; g += pg; b += pb;
            validPixels++;
          }
        }
        
        if(validPixels === 0) return null;
        return new THREE.Color(`rgb(${Math.floor(r/validPixels)}, ${Math.floor(g/validPixels)}, ${Math.floor(b/validPixels)})`);
      }

      anchor.onTargetFound = () => {
        // RESET SEQUENCE: Ensure the rocket comes back if it already flew away
        visualRocket.position.set(0, 0, 0.2);
        launchVelocity = 0;
        particles.visible = false;
        state = "HOVERING";
        
        if (launchTimeout) clearTimeout(launchTimeout);
        
        setTimeout(() => {
          if(!colorsExtracted && anchor.group.visible) {
            const bodyColor = getColorAt3DCoordinate(0, -0.1, 0, 20); 
            const noseColor = getColorAt3DCoordinate(0, 0.3, 0, 15); 
            const finColor = getColorAt3DCoordinate(-0.35, -0.35, 0, 15); 
            
            if(bodyColor) matBody.color = bodyColor;
            if(noseColor) matNose.color = noseColor;
            if(finColor) matFins.color = finColor;
            
            colorsExtracted = true;
          }
        }, 800);

        // Start launch sequence countdown
        launchTimeout = setTimeout(() => {
          if(anchor.group.visible) {
            state = "LAUNCHING";
            particles.visible = true;
          }
        }, 5000);
      };

      document.querySelector("#startButton").addEventListener("click", async () => {
        try {
          document.querySelector("#startButton").style.display = "none";
          await mindarThree.start();
          
          renderer.setAnimationLoop(() => {
            if(state === "LAUNCHING" && anchor.group.visible) {
              launchVelocity += 0.005;
              visualRocket.translateY(launchVelocity); 
              
              for(let i = 0; i < particleCount; i++) {
                let p = particleData[i];
                p.y -= 0.03; 
                p.x += (Math.random() - 0.5) * 0.08; 
                p.z += (Math.random() - 0.5) * 0.08;
                p.life -= 1;
                
                if(p.life <= 0) {
                  p.y = -0.4;
                  p.x = (Math.random() - 0.5) * 0.1;
                  p.z = (Math.random() - 0.5) * 0.1;
                  p.life = 100;
                }
                
                dummy.position.set(p.x, p.y, p.z);
                const scale = Math.max(0, p.life / 100);
                dummy.scale.set(scale, scale, scale);
                dummy.updateMatrix();
                particles.setMatrixAt(i, dummy.matrix);
              }
              particles.instanceMatrix.needsUpdate = true;
            }

            renderer.render(scene, camera);
          });
        } catch (error) {
          alert("Camera initialization failed: " + error.message);
          document.querySelector("#startButton").style.display = "block";
        }
      });
    </script>
  </body>
</html>
